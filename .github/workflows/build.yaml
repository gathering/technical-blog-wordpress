# Builds ghcr.io/gathering/technical-blog-wordpress:latest on every push to
# main. It is also rebuilt every Monday, so that it gets the official
# image's Debian and PHP patches. sys-k8s-workloads deploys each new build
# by its digest.
name: build-image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time. A push during a build waits for it, and a newer push
# replaces the one waiting, so latest ends on the newest commit and never on
# an older build that happened to finish last.
concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          # Always the newest wordpress:php8.4-apache, not a cached one.
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
